<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1877f2">
    <meta name="description" content="CONNECTO - منصة التواصل الاجتماعي">
    <title>CONNECTO | تواصل مع العالم</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="brand">CONNECTO</div>
    <input type="search" id="searchInput" placeholder="ابحث في CONNECTO...">
    <button onclick="showSection('notifications')">🔔</button>
    <button onclick="showSection('profile')">👤</button>
</header>

<div class="layout">

    <aside class="sidebar">
        <button onclick="showSection('home')">🏠 الرئيسية</button>
        <button onclick="showSection('friends')">👥 الأصدقاء</button>
        <button onclick="showSection('messages')">💬 الرسائل</button>
        <button onclick="showSection('notifications')">🔔 الإشعارات</button>
        <button onclick="showSection('profile')">👤 الملف الشخصي</button>
        <button onclick="showSection('settings')">⚙️ الإعدادات</button>
    </aside>

    <main class="main-content">

        <section id="home" class="page active">
            <h2>مرحباً بك في CONNECTO ❤️</h2>

            <div class="create-post">
                <textarea id="postContent" placeholder="بماذا تفكر؟"></textarea>
                <button onclick="publishPost()">نشر المنشور</button>
            </div>

            <div id="postsContainer"></div>
        </section>

        <section id="friends" class="page">
            <h2>الأصدقاء 👥</h2>
            <div id="friendsContainer">قائمة الأصدقاء ستظهر هنا.</div>
        </section>

        <section id="messages" class="page">
            <h2>الرسائل 💬</h2>
            <div id="messagesContainer">المحادثات ستظهر هنا.</div>
        </section>

        <section id="notifications" class="page">
            <h2>الإشعارات 🔔</h2>
            <div id="notificationsContainer">لا توجد إشعارات حالياً.</div>
        </section>

        <section id="profile" class="page">
            <h2>الملف الشخصي 👤</h2>
            <div id="profileContainer">مرحباً بك في ملفك الشخصي.</div>
        </section>

        <section id="settings" class="page">
            <h2>الإعدادات ⚙️</h2>
            <button onclick="toggleTheme()">تغيير الوضع الليلي 🌙</button>
        </section>

    </main>

</div>

<footer>
    CONNECTO © 2026 - جميع الحقوق محفوظة
</footer>

<script src="database.js"></script>
<script src="auth.js"></script>
<script src="posts.js"></script>
<script src="messages.js"></script>
<script src="profile.js"></script>
<script src="notifications.js"></script>
<script src="friends.js"></script>
<script src="search.js"></script>
<script src="settings.js"></script>
<script src="upload.js"></script>
<script src="app.js"></script>

</body>
</html>
